[project]
name = "whispbook-gender-specdec"
version = "0.1.0"
description = "Speculative-decoding gender inference and benchmark prototype for Whispbook."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=3.0.3",
  "pypdf>=6.4,<7",
]

[dependency-groups]
dev = [
  "ipykernel>=7.2.0",
  "ipywidgets>=8.1.8",
  "matplotlib>=3.10.9",
  "mlx-lm==0.31.3",
  "nbformat>=5.10.4",
  "plotly>=6.7.0",
  "pytest==9.0.3",
]

[project.scripts]
gender-specdec = "whispbook_gender_specdec.cli:main"
gender-specdec-pdf = "whispbook_gender_specdec.utils.pdf_parser:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: loads MLX checkpoints and runs model inference",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whispbook_gender_specdec"]
